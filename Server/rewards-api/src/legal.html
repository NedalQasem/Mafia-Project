<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAFIA — __TITLE__</title>
<style>
:root{--paper:#d9cfb4;--ink:#1c170f;--soft:#4a3c24;--crim:#8a1c24}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% 0,#1d1511,#070605 70%);color:var(--ink);font-family:Tahoma,"Segoe UI",Arial,sans-serif;line-height:1.8;padding:24px 14px 48px}
.page{max-width:760px;margin:0 auto;background:var(--paper);border-radius:3px;padding:26px 26px 30px;box-shadow:inset 0 0 40px #8a7a5a99,0 18px 40px #000c;position:relative}
.page::after{content:"";position:absolute;inset:8px;border:1.5px dashed #1c170f55;pointer-events:none}
h1{margin:0 0 4px;font-size:1.7rem;border-bottom:2px solid var(--ink);padding-bottom:6px}
h2{font-size:1.1rem;margin:22px 0 4px;color:var(--crim)}
p,li{color:var(--soft);font-size:.96rem}
ul{padding-inline-start:20px;margin:4px 0}
small{color:#6a5a3a}
a{color:var(--crim)}
.lang{display:flex;gap:10px;justify-content:flex-end;margin-bottom:10px}
.lang a{font-weight:700;text-decoration:none}
.en{direction:ltr;text-align:left;margin-top:34px;padding-top:18px;border-top:2px solid var(--ink)}
</style>
</head>
<body>
<div class="page">
__BODY__
</div>
</body>
</html>
